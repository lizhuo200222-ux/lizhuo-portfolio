h(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}}),{threshold:.02});document.querySelectorAll('.reveal').forEach(e=>obs.observe(e));const stack=document.querySelector('.hero-stack');function animateStack(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=stack.getBoundingClientRect();const t=Math.max(0,Math.min(1,(innerHeight-r.top)/(innerHeight+r.height)));stack.querySelectorAll('.cover').forEach((e,i)=>{const angle=[-8,8][i]*(1-t*.7);const x=(i-.5)*t*35;e.style.transform='translateX('+x+'px) translateY('+(-t*35)+'px) rotate('+angle+'deg)';});}addEventListener('scroll',animateStack,{passive:true});animateStack();</script></body></html>
